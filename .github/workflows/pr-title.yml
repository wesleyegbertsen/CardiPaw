name: PR title

# PRs are squash-merged, so the PR title becomes the commit message on main that GitVersion
# reads to decide the next release's version bump (see GitVersion.yml).
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-commit:
    name: Conventional Commit title
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([a-z0-9 ,/_-]+\))?!?: .+'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "✓ \"$TITLE\""
            exit 0
          fi

          {
            echo "::error title=PR title is not a Conventional Commit::\"$TITLE\""
            echo "Expected <type>[(scope)][!]: <description>"
            echo
            echo "  feat: …           new feature                     → minor release"
            echo "  fix: …            bug fix                         → patch release"
            echo "  perf|refactor|docs|style|test|build|ci|chore|revert: … → patch release"
            echo "  feat!: … / fix(tracker)!: …  breaking change      → major release"
            echo
            echo "Example: feat(pdf): add yearly summary page"
          } >&2
          exit 1
