name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR replaces its running check; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  # Branch protection on main requires a check named "Build" (the job name
  # before Verify existed). This gate reports it from Verify's result. It runs
  # with always() because a skipped required check counts as passing.
  build:
    name: Build
    needs: verify
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check Verify result
        env:
          RESULT: ${{ needs.verify.result }}
        run: |
          echo "Verify: $RESULT"
          [ "$RESULT" = "success" ]

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
