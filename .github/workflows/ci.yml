name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR replaces its running check; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false

  android:
    name: Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Capacitor 8 needs JDK 21; the Android SDK preinstalled on the runner is used as is.
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # android/gradle/wrapper/gradle-wrapper.jar is a committed binary that runs on every build.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build the app's web files and copy them into android/
        run: npm run build:android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # package.json says 0.0.0 outside releases: versionCode is floored at 1 (Android rejects 0).
      - name: Check version
        run: |
          node -e "
            const [m] = require('./android/app/build/outputs/apk/debug/output-metadata.json').elements;
            console.log(m);
            if (m.versionCode !== 1 || m.versionName !== '0.0.0') process.exit(1);
          "

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cardipaw-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
