name: Docker Build & Push

# Called by the Release workflow with the version determined by GitVersion.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        required: true
        type: string
      version:
        description: Release version (SemVer, without "v")
        required: true
        type: string

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Docker tags
        id: tags
        env:
          IMAGE: wesleyegbertsen/cardipaw
          VERSION: ${{ inputs.version }}
        run: |
          # 1.4.2 → :1.4.2, :1.4, :1 and :latest
          IFS=. read -r major minor _ <<< "$VERSION"
          {
            echo "tags<<EOF"
            echo "$IMAGE:latest"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:$major.$minor"
            echo "$IMAGE:$major"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ inputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
