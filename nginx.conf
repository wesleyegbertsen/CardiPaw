# Cache policy per request path. Set via a map so that every `add_header` lives at
# server level: an `add_header` inside a location would drop all server-level headers
# (including the security headers below) for that location.
#   - /assets/* are content-hashed by Vite, so they can be cached forever.
#   - Everything else (index.html, sw.js, workbox-*.js, the manifest, icons, fonts)
#     has a stable URL and must be revalidated so app updates are detected promptly.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/manifest+json application/xml
               image/svg+xml image/x-icon font/ttf;

    # Cache-Control is only sent on successful responses (no `always`), so 404s are
    # never cached as immutable.
    add_header Cache-Control $cache_control;

    # Security headers. `always` adds them to error responses too.
    # CSP notes: the built index.html has no inline scripts (the JSON-LD block is a
    # data block, which CSP does not execute); 'unsafe-inline' for styles is needed for
    # inline style attributes/elements (Vue, Chart.js, Tiptap); data:/blob: images cover
    # pet photos and PDF export (canvas → data URL → jsPDF).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Only honoured by browsers over HTTPS (i.e. behind a TLS-terminating proxy).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Hashed build output: a missing chunk (e.g. a stale one after a deploy) must be a
    # real 404, not index.html with a 200 (which the browser reports as a MIME error).
    location /assets/ {
        try_files $uri =404;
    }

    # nginx's default mime.types has no entry for .ttf or .webmanifest; without these
    # they are served as application/octet-stream and never gzipped. (A `types` block
    # replaces the inherited map, so keep it scoped to these locations.)
    location /fonts/ {
        types { font/ttf ttf; }
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # The router uses hash history, so no SPA fallback is needed; `/` still serves
    # index.html via the `index` directive.
    location / {
        try_files $uri $uri/ =404;
    }
}
